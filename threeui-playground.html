<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThreeUI Playground</title>
    <style>
        body { margin: 0; background: #0a0a0a; color: #fff; font-family: system-ui, sans-serif; }
        header { padding: 16px 24px; }
        code { color: #f967fb; }
        .stage { height: 70vh; margin: 0 24px; border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body>
    <!-- Dev-only page (not part of the deployed build). Run `npm run dev` and open /threeui-playground.html.
         Change data-threeui to any component registered in src/threeui-registry.js. -->
    <header>
        <strong>ThreeUI playground</strong> &middot; edit <code>data-threeui</code> in threeui-playground.html
    </header>
    <div class="stage" data-threeui="SylvaLivingWorldScene"></div>
    <script type="module" src="src/threeui-islands.js"></script>
</body>
</html>
